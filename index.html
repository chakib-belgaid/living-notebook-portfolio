    <!-- Phones in portrait get the garden journey (src/phone.ts). Marking it
         before the first layout keeps the reading page's preview image from loading. -->
    <script>
      if (matchMedia("screen and (max-width: 899px) and (min-height: 500px)").matches && !/[?&]view=read\b/.test(location.search))
        document.documentElement.dataset.journey = "pending";
    </script>
